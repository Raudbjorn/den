query LinearStartTeamIssues(
  $first: Int!
  $after: String
  $filter: IssueFilter!
  $attachmentsPerIssue: Int!
) {
  issues(first: $first, after: $after, sort: [{ createdAt: { order: Ascending } }], filter: $filter) {
    nodes {
      ...LinearIssueFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
