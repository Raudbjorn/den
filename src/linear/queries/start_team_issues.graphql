query LinearStartTeamIssues($first: Int!, $after: String, $filter: IssueFilter!) {
  issues(first: $first, after: $after, orderBy: createdAt, filter: $filter) {
    nodes {
      id
      identifier
      title
      url
      priority
      createdAt
      updatedAt
      branchName
      team {
        id
        key
      }
      state {
        id
        name
        type
      }
      assignee {
        id
        name
      }
      cycle {
        id
        number
        name
        isActive
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
