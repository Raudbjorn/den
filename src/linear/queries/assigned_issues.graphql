query LinearAssignedIssues($first: Int!, $after: String, $attachmentsPerIssue: Int!, $filter: IssueFilter!) {
  viewer {
    assignedIssues(
      first: $first
      after: $after
      orderBy: updatedAt
      filter: $filter
    ) {
      nodes {
        ...LinearIssueFields
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
