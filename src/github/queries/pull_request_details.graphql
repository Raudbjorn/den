# Checks and reviews of one PR: the selection inside `... on PullRequest { }`.
# den repeats it once per PR in a batch (aliases pr0, pr1, …), replacing $PR_ID
# with that PR's own variable ($id0, $id1, …); `isRequired` needs the PR's ID.
# The head is read again here: the reviews' commits are compared against the
# head read in the same response, not against the PR list's.
headRefOid
reviewThreads(first: 100) {
  pageInfo { hasNextPage endCursor }
  nodes { id isResolved comments(first: 1) { nodes { url author { login } } } }
}
# Every review, for Review Points (#75): the body is read only to tell a stock
# approval from more, and is not kept.
reviews(first: 50) {
  pageInfo { hasNextPage endCursor }
  nodes { databaseId state submittedAt url body author { __typename login } }
}
# The conversation's comments, for their marker lines (#75): nothing else of
# a body is kept.
comments(first: 100) {
  pageInfo { hasNextPage endCursor }
  nodes { createdAt url body author { login } }
}
reviewRequests(first: 50) {
  pageInfo { hasNextPage endCursor }
  nodes {
    requestedReviewer {
      __typename
      ... on User { login }
      ... on Bot { login }
      ... on Mannequin { login }
      ... on Team { slug organization { login } }
    }
  }
}
latestOpinionatedReviews(first: 50) {
  pageInfo { hasNextPage endCursor }
  nodes { state author { __typename login } commit { oid } }
}
latestReviews(first: 50) {
  pageInfo { hasNextPage endCursor }
  nodes { state author { __typename login } commit { oid } }
}
commits(last: 1) {
  nodes {
    commit {
      statusCheckRollup {
        contexts(first: 100) {
          pageInfo { hasNextPage endCursor }
          nodes {
            __typename
            ... on CheckRun {
              name
              status
              conclusion
              isRequired(pullRequestId: $PR_ID)
              checkSuite { workflowRun { workflow { name } } }
            }
            ... on StatusContext {
              context
              state
              isRequired(pullRequestId: $PR_ID)
            }
          }
        }
      }
    }
  }
}
