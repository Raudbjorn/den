# The facts den keeps per open PR. Appended to both PR queries. Checks and
# reviews come from pull_request_details.graphql, one query per batch of PRs.
# `body` is read only when $bodies is true (an Owner with a Repo that requires
# screenshots, #79); den keeps only the Screenshots state it gives, never the body.
fragment PullRequestFacts on PullRequest {
  id
  number
  title
  url
  isDraft
  createdAt
  updatedAt
  author { login }
  baseRefName
  headRefName
  headRefOid
  headRepository { name owner { login } }
  mergeable
  mergeStateStatus
  reviewDecision
  isInMergeQueue
  body @include(if: $bodies)
}
