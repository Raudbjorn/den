[package]
name = "den"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "A terminal workspace for GitHub Next Steps and Claude Code Jobs"
build = "build.rs"

[[bin]]
name = "den"
path = "src/main.rs"

[dependencies]
# The rendering engine, vendored from design-system@464835c (ADR-0001, vendor/raudbjorn-tui/UPSTREAM.md).
raudbjorn-tui = { path = "vendor/raudbjorn-tui" }
crepuscularity-tui = "=0.4.22"
ratatui = "=0.30.2"
crossterm = "=0.29.0"
# Catches SIGTERM/SIGHUP so the terminal is restored; already in the graph through crossterm.
signal-hook = "=0.3.18"
# Display width in terminal cells, for wrapping; same version the vendored engine pins.
unicode-width = "=0.2.0"
# Cuts text between graphemes, as ratatui draws it (one cell symbol per grapheme);
# already in the graph through ratatui.
unicode-segmentation = "=1.13.3"
thiserror = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.2.1"
jiff = { version = "1.0.1", features = ["serde"] }
# The Linear source's HTTPS GraphQL client (#32): blocking, as den's runtime is
# threads; rustls with bundled web PKI roots, no gzip or other features.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
# The bear (#10): rasterised from assets/brand/bear-mark.svg, drawn with the kitty
# graphics protocol or half-blocks. Versions as proven in the prototype.
ratatui-image = { version = "=12.0.0-rc.3", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false }
resvg = { version = "0.50", default-features = false }

[build-dependencies]
# build.rs generates the Oxide palette from assets/tokens/oxide.tokens.json.
serde_json = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace]
members = [".", "vendor/raudbjorn-tui"]
default-members = [".", "vendor/raudbjorn-tui"]
resolver = "3"
